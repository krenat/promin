services:
  promin:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PROMIN_DATA_DIR: /data
    ports:
      - "${PROMIN_PORT:-8080}:${PROMIN_PORT:-8080}"
    volumes:
      - promin-data:/data
    # So that ffmpeg does not starve neighbouring containers of CPU.
    cpus: ${PROMIN_CPUS:-2}
    stop_grace_period: 10s

volumes:
  promin-data:
