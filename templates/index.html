<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<title>Promin</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1115;
    --panel: #1A1D24;
    --line: #2A2E37;
    --text: #F2F0EA;
    --muted: #9AA0AA;
    --accent: #FFC53D;
    --on-accent: #0F1115;
    --danger: #FF6B5E;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.4 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 48px;
    margin-bottom: 16px;
  }
  header img { width: 28px; height: 28px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; flex: 1; }
  .projector {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 14px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); transition: background-color 150ms; }
  button.projector { background: transparent; border: 0; padding: 0; font-weight: 400; cursor: pointer; }
  #pair { background: var(--panel); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  #pair p { margin: 0; }
  #pair .hint { margin-top: 8px; color: var(--muted); font-size: 14px; }
  #pair-url { font-weight: 600; overflow-wrap: anywhere; }
  .projector.on .dot { background: var(--accent); }
  .projector.on { color: var(--text); }

  button {
    font: inherit;
    font-weight: 600;
    min-height: 48px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 150ms, border-color 150ms, opacity 150ms;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .outline { background: transparent; color: var(--text); border-color: var(--line); }
  .outline:hover:not(:disabled) { border-color: var(--muted); }

  #upload-btn { width: 100%; }
  #progress { margin-top: 16px; }
  #progress[hidden] { display: none; }
  .progress-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; width: 0; background: var(--accent); transition: width 150ms; }
  #message { margin: 16px 0 0; color: var(--danger); font-size: 14px; }
  #message:empty { display: none; }
  #disk { margin: 16px 0 24px; color: var(--muted); font-size: 14px; }

  #list { display: grid; gap: 16px; }
  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }
  .card { background: var(--panel); border-radius: var(--radius); overflow: hidden; }
  .thumb {
    aspect-ratio: 16 / 9;
    background: #000;
    display: grid;
    place-items: center;
  }
  .thumb { position: relative; }
  .thumb .mark { width: 48px; height: 48px; opacity: 0.25; }
  .thumb .cover { width: 100%; height: 100%; object-fit: contain; }
  .duration {
    position: absolute;
    right: 8px;
    bottom: 8px;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(15, 17, 21, 0.8);
    font-size: 13px;
    font-weight: 600;
  }
  .card .track { margin: -8px 0 16px; height: 4px; }
  .error-text {
    margin: -8px 0 16px;
    color: var(--danger);
    font-size: 14px;
    overflow-wrap: anywhere;
  }
  .body { padding: 16px; }
  .title-row { display: flex; align-items: flex-start; gap: 8px; }
  .name { flex: 1; font-weight: 600; overflow-wrap: anywhere; }
  .meta { margin: 8px 0 16px; color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; }

  details.menu { position: relative; }
  details.menu summary {
    list-style: none;
    width: 48px;
    height: 48px;
    margin: -12px -12px -12px 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
  }
  details.menu summary::-webkit-details-marker { display: none; }
  details.menu .pop {
    position: absolute;
    right: -4px;
    top: 40px;
    z-index: 2;
    min-width: 176px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px;
  }
  details.menu .pop button {
    width: 100%;
    background: transparent;
    color: var(--danger);
    text-align: left;
    padding: 0 12px;
  }

  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    margin-top: 32px;
    color: var(--muted);
    font-size: 14px;
  }
  footer .who { flex: 1; min-width: 160px; }
  footer a { color: var(--text); }
  footer form { margin: 0; }
  footer button { min-height: 48px; padding: 0 16px; }
  [hidden] { display: none !important; }

  body.has-remote main { padding-bottom: 400px; }
  body.has-remote.remote-collapsed main { padding-bottom: 140px; }
  #remote {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 5;
    background: var(--panel);
    border-top: 1px solid var(--line);
    border-radius: var(--radius) var(--radius) 0 0;
  }
  #remote .inner {
    max-width: 560px;
    margin: 0 auto;
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .remote-head { display: flex; align-items: center; gap: 8px; min-height: 48px; }
  #remote-title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    width: 48px; height: 48px; padding: 0;
    display: grid; place-items: center;
    background: transparent; color: var(--text);
    border-radius: 50%;
  }
  .icon-btn svg, .round svg { width: 24px; height: 24px; fill: currentColor; }
  #remote-toggle svg { transition: transform 150ms; }
  body.remote-collapsed #remote-toggle svg { transform: rotate(180deg); }
  body.remote-collapsed .remote-body { display: none; }
  #r-mini { display: none; }
  body.remote-collapsed #r-mini { display: grid; }
  .seek { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 14px; }
  .seek span { min-width: 44px; font-variant-numeric: tabular-nums; }
  .seek span:last-child { text-align: right; }
  input[type=range] { flex: 1; min-width: 0; height: 48px; margin: 0; accent-color: var(--accent); background: transparent; }
  .transport { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  .round {
    width: 48px; height: 48px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    background: transparent; color: var(--text); border-color: var(--line);
    font-size: 14px;
  }
  .round.big { width: 72px; height: 72px; background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .round.big svg { width: 32px; height: 32px; }
  .volume { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .volume svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
  #r-stop { width: 100%; margin-top: 8px; }
  #up-next { margin: -4px 0 4px; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #player {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    display: flex;
    flex-direction: column;
  }
  #player[hidden] { display: none; }
  #player video { flex: 1; min-height: 0; width: 100%; background: #000; }
  #player .bar-top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 16px;
    padding-top: calc(8px + env(safe-area-inset-top));
  }
  .player-head { flex: 1; min-width: 0; }
  #player-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #player-info { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #player-close { padding: 0 16px; }

  /* ---------- compact card grid ---------- */
  main { max-width: 1200px; }
  #upload-btn, #progress, #pair { max-width: 560px; }
  #list { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  @media (min-width: 600px) {
    #list { gap: 16px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
  .empty { grid-column: 1 / -1; }
  .card { position: relative; display: flex; flex-direction: column; }
  button.thumb {
    width: 100%; min-height: 0; padding: 0; border: 0; border-radius: 0;
    color: var(--text); cursor: pointer;
  }
  button.thumb:disabled { opacity: 1; cursor: default; }
  button.thumb:focus-visible { outline-offset: -2px; }
  .thumb .play {
    position: absolute; left: 50%; top: 50%;
    width: 40px; height: 40px; margin: -20px 0 0 -20px;
    display: grid; place-items: center;
    border-radius: 50%; background: rgba(15, 17, 21, 0.6);
    transition: background-color 150ms;
  }
  button.thumb:hover .play { background: rgba(15, 17, 21, 0.85); }
  .thumb .play svg { width: 20px; height: 20px; fill: var(--text); margin-left: 2px; }
  .duration { right: 6px; bottom: 6px; padding: 1px 6px; font-size: 12px; }
  .card .body { flex: 1; display: flex; flex-direction: column; padding: 12px; }
  .name {
    flex: none; font-size: 14px; line-height: 1.3; min-height: 2.6em;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .meta { margin: 4px 0 12px; font-size: 12px; }
  .card .track { margin: -4px 0 12px; }
  .error-text {
    margin: -4px 0 12px; font-size: 12px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  }
  .actions { margin-top: auto; }
  .actions button { font-size: 14px; padding: 0 8px; }
  details.menu { position: absolute; top: 4px; right: 4px; z-index: 1; }
  details.menu summary {
    width: 40px; height: 40px; margin: 0;
    color: var(--text); background: rgba(15, 17, 21, 0.6);
  }
  details.menu .pop { right: 0; top: 44px; min-width: 140px; }

  /* ---------- video quality ---------- */
  .quality {
    position: absolute; left: 6px; bottom: 6px; padding: 1px 6px; border-radius: 6px;
    background: rgba(15, 17, 21, 0.8); font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
  }
  .quality.hd { color: var(--accent); }
  body.selecting .quality { display: none; }

  /* ---------- folders ---------- */
  #folders {
    display: flex; gap: 8px; margin: 0 -16px 12px; padding: 0 16px 4px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  #folders::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px;
    background: transparent; color: var(--text); border-color: var(--line);
    font-size: 14px; white-space: nowrap;
  }
  .chip .n { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chip[aria-pressed="true"] .n { color: var(--on-accent); opacity: 0.7; }
  .chip.add { color: var(--muted); border-style: dashed; }
  #folder-tools { display: flex; gap: 8px; margin: -4px 0 12px; }
  #folder-tools button { min-height: 40px; padding: 0 14px; font-size: 14px; }
  details.menu .pop button.neutral { color: var(--text); }
  #move-dialog {
    width: min(360px, calc(100vw - 32px)); padding: 16px; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--panel); color: var(--text);
  }
  #move-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
  #move-dialog h2 { margin: 0 0 12px; font-size: 16px; overflow-wrap: anywhere; }
  #move-options { display: grid; gap: 8px; max-height: 50vh; overflow-y: auto; }
  #move-options button { text-align: left; padding: 0 16px; }
  #move-options button[aria-current="true"] { border-color: var(--accent); }
  #move-cancel { width: 100%; margin-top: 12px; }

  /* ---------- watch queue ---------- */
  .actions { gap: 4px; }
  .actions .queue-add { flex: none; width: 36px; padding: 0; }
  .actions button.primary { padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions .queue-add svg { width: 22px; height: 22px; fill: currentColor; }
  #queue {
    max-width: 560px; margin-bottom: 16px; padding: 12px 16px 16px;
    background: var(--panel); border-radius: var(--radius);
  }
  .queue-head { display: flex; align-items: center; gap: 8px; }
  .queue-head h2 { flex: 1; margin: 0; font-size: 16px; font-weight: 700; }
  .queue-head button { min-height: 40px; padding: 0 14px; font-size: 14px; }
  #queue-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .q-row { display: flex; align-items: center; gap: 4px; }
  .q-row img { width: 64px; height: 36px; flex: none; margin-right: 8px; object-fit: cover; border-radius: 6px; background: #000; }
  .q-row img.mark { object-fit: contain; padding: 6px; }
  .q-name { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-row .icon-btn { width: 40px; height: 40px; min-height: 40px; flex: none; color: var(--muted); }
  .q-row .icon-btn:hover:not(:disabled) { color: var(--text); }
  .q-row .icon-btn svg { width: 20px; height: 20px; }

  /* ---------- selecting several videos (administrators) ---------- */
  #select-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin: -8px 0 16px;
  }
  #select-bar button { min-height: 40px; padding: 0 16px; font-size: 14px; }
  body.selecting #select-bar {
    position: sticky; top: 0; z-index: 3;
    margin: -8px -16px 16px; padding: 8px 16px;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  #select-count { flex: 1 0 100%; font-weight: 600; }
  body.selecting #select-bar button { flex: 1; }
  .danger-btn { background: var(--danger); color: var(--on-accent); }
  body.selecting details.menu, body.selecting .card .actions { display: none; }
  body.selecting .thumb .play { display: none; }
  .check {
    position: absolute; top: 8px; left: 8px;
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    border: 2px solid var(--text); background: rgba(15, 17, 21, 0.6);
  }
  .check svg { width: 16px; height: 16px; fill: var(--on-accent); visibility: hidden; }
  .card.selected { outline: 3px solid var(--accent); outline-offset: -3px; }
  .card.selected .check { background: var(--accent); border-color: var(--accent); }
  .card.selected .check svg { visibility: visible; }
</style>
</head>
<body>
<main>
  <header>
    <img src="/static/logo.svg" alt="">
    <h1>Promin</h1>
    <button class="projector" id="projector" type="button" aria-controls="pair" aria-expanded="false">
      <span class="dot"></span><span id="tv-text">Проектор не на зв'язку</span>
    </button>
  </header>

  <section id="pair" hidden>
    <p>Відкрийте на проекторі адресу <span id="pair-url"></span></p>
    <p class="hint">На екрані з'явиться QR-код. Наведіть на нього камеру цього телефона, відкрийте посилання і підтвердьте підключення.</p>
  </section>

  <input id="file" type="file" accept="video/*" hidden>
  <button id="upload-btn" class="primary" type="button" hidden>Завантажити відео</button>
  <div id="progress" hidden>
    <div class="progress-row"><span id="progress-name"></span><span id="progress-pct">0%</span></div>
    <div class="track"><div class="bar" id="progress-bar"></div></div>
  </div>
  <p id="message" role="alert"></p>
  <p id="disk" hidden></p>
  <section id="queue" hidden aria-label="Черга перегляду">
    <div class="queue-head">
      <h2 id="queue-title">Черга</h2>
      <button id="queue-play" class="primary" type="button">Грати</button>
      <button id="queue-clear" class="outline" type="button">Очистити</button>
    </div>
    <ol id="queue-list"></ol>
  </section>

  <nav id="folders" aria-label="Теки" hidden></nav>
  <div id="folder-tools" hidden>
    <button id="folder-rename" class="outline" type="button">Перейменувати теку</button>
    <button id="folder-delete" class="outline" type="button">Видалити теку</button>
  </div>
  <div id="select-bar" hidden>
    <button id="select-start" class="outline" type="button">Вибрати кілька</button>
    <span id="select-count" hidden></span>
    <button id="select-all" class="outline" type="button" hidden>Усі</button>
    <button id="select-delete" class="danger-btn" type="button" hidden disabled>Видалити</button>
    <button id="select-cancel" class="outline" type="button" hidden>Скасувати</button>
  </div>

  <section id="list" aria-live="polite"></section>

  <dialog id="move-dialog" aria-labelledby="move-title">
    <h2 id="move-title"></h2>
    <div id="move-options"></div>
    <button id="move-cancel" class="outline" type="button">Скасувати</button>
  </dialog>

  <footer>
    <span class="who" id="who"></span>
    <a id="pair-link" href="#pair">Підключити проектор</a>
    <a id="settings-link" href="/settings" hidden>Налаштування</a>
    <a id="users-link" href="/users" hidden>Користувачі</a>
    <form method="post" action="/logout"><button class="outline" type="submit">Вийти</button></form>
  </footer>
</main>

<section id="remote" hidden aria-label="Пульт проектора">
  <div class="inner">
    <div class="remote-head">
      <div id="remote-title"></div>
      <button id="r-mini" class="icon-btn" type="button" aria-label="Пауза або відтворення">
        <svg viewBox="0 0 24 24"><path id="r-mini-icon" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="remote-toggle" class="icon-btn" type="button" aria-label="Згорнути або розгорнути пульт">
        <svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
      </button>
    </div>
    <div id="up-next" hidden></div>
    <div class="remote-body">
      <div class="seek">
        <span id="r-pos">0:00</span>
        <input id="r-seek" type="range" min="0" max="0" step="1" value="0" aria-label="Позиція у відео">
        <span id="r-dur">0:00</span>
      </div>
      <div class="transport">
        <button id="r-prev" class="round outline" type="button" aria-label="Попереднє відео">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button id="r-back" class="round outline" type="button" aria-label="Назад на 10 секунд">−10</button>
        <button id="r-play" class="round big" type="button" aria-label="Пауза або відтворення">
          <svg viewBox="0 0 24 24"><path id="r-play-icon" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="r-fwd" class="round outline" type="button" aria-label="Вперед на 10 секунд">+10</button>
        <button id="r-next" class="round outline" type="button" aria-label="Наступне відео">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg>
        </button>
      </div>
      <div class="volume">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm11.5 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5z"/></svg>
        <input id="r-vol" type="range" min="0" max="100" step="1" value="100" aria-label="Гучність відео">
      </div>
      <button id="r-stop" class="outline" type="button">Зупинити показ</button>
    </div>
  </div>
</section>

<div id="player" hidden>
  <div class="bar-top">
    <div class="player-head">
      <span id="player-title"></span>
      <span id="player-info"></span>
    </div>
    <button id="player-close" class="outline" type="button">Закрити</button>
  </div>
  <video id="video" controls playsinline></video>
</div>

<script>
(function () {
  var fileInput = document.getElementById('file');
  var uploadBtn = document.getElementById('upload-btn');
  var progress = document.getElementById('progress');
  var progressName = document.getElementById('progress-name');
  var progressPct = document.getElementById('progress-pct');
  var progressBar = document.getElementById('progress-bar');
  var message = document.getElementById('message');
  var disk = document.getElementById('disk');
  var list = document.getElementById('list');
  var player = document.getElementById('player');
  var video = document.getElementById('video');
  var playerTitle = document.getElementById('player-title');
  var maxUpload = Infinity;
  var isAdmin = false;
  var canManage = false;  // a person with a login, not a paired projector
  var selecting = false;  // administrators pick several videos to delete at once
  var selected = {};      // id → true
  var videosCache = [];
  var ws = null;
  var wsRetry = 1000;
  var wsTimer = null;
  var tvConnected = false;
  var tvState = null;
  var seeking = false;
  var ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
  var ICON_PLAY = 'M7 4.5v15l12-7.5z';
  var ICON_ADD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14 0v-3h2v3h3v2h-3v3h-2v-3h-3v-2z"/></svg>';
  var ICON_DONE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.6 4.9 12l-1.4 1.4 6 6 11-11-1.4-1.4z"/></svg>';
  var ICON_UP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg>';
  var ICON_DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>';
  var ICON_REMOVE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg>';
  var queue = [];  // what the projector plays next; the server sends it over the WebSocket
  var folders = [];        // [{id, name, count}]
  var FOLDER_KEY = 'promin.folder';
  var currentFolder = 'all';  // 'all', 'none' or a folder id; remembered on this phone
  try { currentFolder = localStorage.getItem(FOLDER_KEY) || 'all'; } catch (e) {}

  function formatSize(bytes) {
    if (bytes < 1048576) return Math.max(1, Math.round(bytes / 1024)) + ' КБ';
    var mb = bytes / 1048576;
    if (mb >= 1024) return (mb / 1024).toFixed(1).replace('.', ',') + ' ГБ';
    if (mb >= 10) return Math.round(mb) + ' МБ';
    return mb.toFixed(1).replace('.', ',') + ' МБ';
  }

  function formatDuration(seconds) {
    var total = Math.round(seconds);
    var h = Math.floor(total / 3600);
    var m = Math.floor(total % 3600 / 60);
    var sec = total % 60;
    var tail = (sec < 10 ? '0' : '') + sec;
    if (h) return h + ':' + (m < 10 ? '0' : '') + m + ':' + tail;
    return m + ':' + tail;
  }

  // Quality of a finished video, from what the server read off the file.
  function qualityLabel(info) {
    var short = Math.min(info.width, info.height);  // a vertical 1080×1920 video is 1080p too
    var label = short >= 2000 ? '4K' : short >= 1400 ? '1440p' : short >= 1000 ? '1080p' : short >= 700 ? '720p' : 'SD';
    if (info.fps >= 48) label += Math.round(info.fps);
    return label;
  }

  function formatBitrate(kbps) {
    if (kbps >= 1000) return (kbps / 1000).toFixed(1).replace('.', ',') + ' Мбіт/с';
    return kbps + ' кбіт/с';
  }

  var CODEC_NAMES = { h264: 'H.264', hevc: 'HEVC', aac: 'AAC', mp3: 'MP3', ac3: 'AC3' };

  function qualityDetails(info) {
    var parts = [info.width + '×' + info.height];
    if (info.fps) parts.push(String(Math.round(info.fps * 100) / 100).replace('.', ',') + ' кадрів/с');
    if (info.bitrate_kbps) parts.push(formatBitrate(info.bitrate_kbps));
    if (info.video_codec) parts.push(CODEC_NAMES[info.video_codec] || info.video_codec);
    if (info.audio_codec) {
      var layout = info.channels === 1 ? 'моно' : info.channels === 2 ? 'стерео' : info.channels + ' кан.';
      parts.push('звук ' + (CODEC_NAMES[info.audio_codec] || info.audio_codec) + ' ' + layout);
    } else {
      parts.push('без звуку');
    }
    return parts.join(' · ');
  }

  function statusText(item) {
    if (item.status === 'queued') return 'у черзі';
    if (item.status === 'processing') return 'обробляється ' + Math.floor((item.progress || 0) * 100) + '%';
    if (item.status === 'error') return 'помилка';
    return 'готове';
  }

  function lastLine(text) {
    var lines = String(text || '').split('\n').filter(function (l) { return l.trim(); });
    var line = lines.length ? lines[lines.length - 1].trim() : 'Невідома помилка';
    return line.length > 240 ? line.slice(0, 240) + '…' : line;
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function errorText(xhrOrResponseBody, fallback) {
    try {
      var data = JSON.parse(xhrOrResponseBody);
      if (data && typeof data.detail === 'string') return data.detail;
    } catch (e) {}
    return fallback;
  }

  function displayName(name) {
    return name.replace(/\.[a-z0-9]{2,4}$/i, '');
  }

  function renderCard(item) {
    var card = el('article', 'card');
    var ready = item.status === 'ready';

    // The thumbnail is the "watch here" button; while selecting, it ticks the video instead.
    var thumb = el('button', 'thumb');
    thumb.type = 'button';
    thumb.disabled = !ready && !selecting;
    if (selecting) {
      thumb.setAttribute('aria-label', 'Вибрати: ' + item.name);
      thumb.setAttribute('aria-pressed', String(!!selected[item.id]));
      if (selected[item.id]) card.className += ' selected';
    } else {
      thumb.setAttribute('aria-label', 'Дивитись тут: ' + item.name);
    }
    var picture = el('img', item.thumb ? 'cover' : 'mark');
    picture.src = item.thumb ? '/thumb/' + item.id + '?v=' + (item.thumb_v || 1) : '/static/logo.svg';
    picture.alt = '';
    picture.loading = 'lazy';
    thumb.appendChild(picture);
    if (ready) {
      var play = el('span', 'play');
      play.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';
      thumb.appendChild(play);
    }
    if (item.duration) thumb.appendChild(el('span', 'duration', formatDuration(item.duration)));
    if (ready && item.info && item.info.width) {
      var label = qualityLabel(item.info);
      var badge = el('span', 'quality' + (label === 'SD' ? '' : ' hd'), label);
      badge.title = qualityDetails(item.info);
      thumb.appendChild(badge);
    }
    if (selecting) {
      var check = el('span', 'check');
      check.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.6 4.9 12l-1.4 1.4 6 6 11-11-1.4-1.4z"/></svg>';
      thumb.appendChild(check);
    }
    thumb.addEventListener('click', function () {
      if (selecting) toggleSelected(item.id);
      else openPlayer(item);
    });
    card.appendChild(thumb);

    if (canManage) {
      var menu = el('details', 'menu');
      var summary = el('summary', null, '⋯');
      summary.setAttribute('aria-label', 'Меню відео: ' + item.name);
      menu.appendChild(summary);
      var pop = el('div', 'pop');
      if (folders.length) {
        var moveBtn = el('button', 'neutral', 'Перенести в теку');
        moveBtn.type = 'button';
        moveBtn.addEventListener('click', function () {
          menu.open = false;
          openMoveDialog(item);
        });
        pop.appendChild(moveBtn);
      }
      var del = el('button', null, 'Видалити');
      del.type = 'button';
      del.addEventListener('click', function () {
        menu.open = false;
        if (confirm('Видалити «' + item.name + '»? Відновити його не вдасться.')) remove(item.id);
      });
      pop.appendChild(del);
      menu.appendChild(pop);
      card.appendChild(menu);
    }

    var body = el('div', 'body');
    var name = el('div', 'name', displayName(item.name));
    name.title = item.name;
    body.appendChild(name);
    // A finished video says how heavy it is; one in progress says where it is.
    var metaText = ready && item.info && item.info.bitrate_kbps
      ? formatBitrate(item.info.bitrate_kbps)
      : statusText(item);
    var meta = el('div', 'meta', formatSize(item.size) + ' · ' + metaText);
    if (ready && item.info) meta.title = qualityDetails(item.info);
    body.appendChild(meta);

    if (item.status === 'processing') {
      var track = el('div', 'track');
      var bar = el('div', 'bar');
      bar.style.width = Math.floor((item.progress || 0) * 100) + '%';
      track.appendChild(bar);
      body.appendChild(track);
    }
    if (item.status === 'error') {
      body.appendChild(el('div', 'error-text', lastLine(item.error)));
    }

    var actions = el('div', 'actions');
    if (ready) {
      var cast = el('button', 'primary', 'На проектор');
      cast.type = 'button';
      cast.disabled = !canCast();
      cast.addEventListener('click', function () {
        document.body.classList.remove('remote-collapsed');
        command('load', { video_id: item.id });
      });
      actions.appendChild(cast);
      var add = el('button', 'outline queue-add');
      add.type = 'button';
      add.title = 'Додати в чергу';
      add.setAttribute('aria-label', 'Додати в чергу: ' + item.name);
      add.innerHTML = ICON_ADD;
      add.addEventListener('click', function () { addToQueue(item.id, add); });
      actions.appendChild(add);
    } else if (item.status === 'error' && canManage) {
      var again = el('button', 'outline', 'Повторити');
      again.type = 'button';
      again.addEventListener('click', function () { retry(item.id); });
      actions.appendChild(again);
    }
    if (actions.childNodes.length) body.appendChild(actions);

    card.appendChild(body);
    return card;
  }

  var pollTimer = null;
  var lastRendered = null;

  function schedule(data) {
    clearTimeout(pollTimer);
    var busy = data.videos.some(function (v) {
      return v.status === 'queued' || v.status === 'processing';
    });
    // While something is processing, the list refreshes itself.
    if (busy) pollTimer = setTimeout(refresh, 3000);
  }

  function renderList() {
    // Do not redraw an unchanged list, so that an open menu stays open.
    var snapshot = JSON.stringify([videosCache, folders, currentFolder, canCast(), selecting, selected]);
    if (snapshot === lastRendered) return;
    lastRendered = snapshot;
    list.textContent = '';
    if (!videosCache.length) {
      list.appendChild(el('div', 'empty', 'Тут з’являться ваші відео'));
      return;
    }
    var shown = visibleVideos();
    if (!shown.length) {
      list.appendChild(el('div', 'empty', currentFolder === 'none'
        ? 'Усі відео розкладено по теках'
        : 'У цій теці поки немає відео. Перенесіть сюди відео через меню «⋯» на картці або завантажте нове.'));
      return;
    }
    shown.forEach(function (item) { list.appendChild(renderCard(item)); });
  }

  // ----------------------------------------------------------------- folders

  function visibleVideos() {
    if (currentFolder === 'all') return videosCache;
    var wanted = currentFolder === 'none' ? null : currentFolder;
    return videosCache.filter(function (v) { return (v.folder || null) === wanted; });
  }

  function folderById(id) {
    for (var i = 0; i < folders.length; i++) if (folders[i].id === id) return folders[i];
    return null;
  }

  function setFolder(id) {
    currentFolder = id;
    try { localStorage.setItem(FOLDER_KEY, id); } catch (e) {}
    if (selecting) setSelecting(false);
    renderFolders();
    renderList();
    if (isAdmin) updateSelectBar();
  }

  function chip(label, count, id, extraClass) {
    var button = el('button', 'chip' + (extraClass ? ' ' + extraClass : ''), label);
    button.type = 'button';
    if (count != null) button.appendChild(el('span', 'n', String(count)));
    if (id != null) {
      button.setAttribute('aria-pressed', String(currentFolder === id));
      button.addEventListener('click', function () { setFolder(id); });
    }
    return button;
  }

  function renderFolders() {
    var nav = document.getElementById('folders');
    // Without folders the bar would only say "all": it appears once there is a folder,
    // or straight away for people who can create one.
    nav.hidden = !folders.length && !canManage;
    nav.textContent = '';
    if (!nav.hidden) {
      nav.appendChild(chip('Усі', videosCache.length, 'all'));
      folders.forEach(function (f) { nav.appendChild(chip(f.name, f.count, f.id)); });
      var loose = videosCache.filter(function (v) { return !v.folder; }).length;
      if (folders.length) nav.appendChild(chip('Без теки', loose, 'none'));
      if (canManage) {
        var add = chip('+ Тека', null, null, 'add');
        add.setAttribute('aria-label', 'Нова тека');
        add.addEventListener('click', createFolder);
        nav.appendChild(add);
      }
    }
    var folder = folderById(currentFolder);
    document.getElementById('folder-tools').hidden = !(folder && canManage);
    uploadBtn.textContent = folder ? 'Завантажити в «' + folder.name + '»' : 'Завантажити відео';
  }

  function folderRequest(method, url, body) {
    message.textContent = '';
    var options = { method: method, headers: {} };
    if (body) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    return fetch(url, options).then(function (r) {
      if (r.status === 401) { location.href = '/login'; throw new Error('login'); }
      if (!r.ok) {
        return r.text().then(function (text) {
          throw new Error(errorText(text, 'Не вдалося змінити теки.'));
        });
      }
      return r.status === 204 ? null : r.json();
    }).catch(function (error) {
      if (error.message !== 'login') {
        message.textContent = error.message === 'Failed to fetch'
          ? 'Немає зв’язку із сервером. Спробуйте ще раз.' : error.message;
      }
      throw error;
    });
  }

  function createFolder() {
    var name = prompt('Назва нової теки:');
    if (name == null || !name.trim()) return;
    folderRequest('POST', '/api/folders', { name: name }).then(function (folder) {
      return refresh().then(function () { setFolder(folder.id); });
    }, function () {});
  }

  document.getElementById('folder-rename').addEventListener('click', function () {
    var folder = folderById(currentFolder);
    if (!folder) return;
    var name = prompt('Нова назва теки:', folder.name);
    if (name == null || !name.trim() || name.trim() === folder.name) return;
    folderRequest('PATCH', '/api/folders/' + folder.id, { name: name }).then(refresh, function () {});
  });

  document.getElementById('folder-delete').addEventListener('click', function () {
    var folder = folderById(currentFolder);
    if (!folder) return;
    if (!confirm('Видалити теку «' + folder.name + '»? Відео з неї не видаляться, а залишаться без теки.')) return;
    folderRequest('DELETE', '/api/folders/' + folder.id).then(function () {
      setFolder('all');
      return refresh();
    }, function () {});
  });

  var moveDialog = document.getElementById('move-dialog');

  function openMoveDialog(item) {
    document.getElementById('move-title').textContent = 'Перенести «' + displayName(item.name) + '»';
    var options = document.getElementById('move-options');
    options.textContent = '';
    var choices = folders.map(function (f) { return { id: f.id, name: f.name }; });
    choices.push({ id: null, name: 'Без теки' });
    choices.forEach(function (choice) {
      var here = (item.folder || null) === choice.id;
      var button = el('button', 'outline', choice.name + (here ? ' · тут' : ''));
      button.type = 'button';
      button.disabled = here;
      if (here) button.setAttribute('aria-current', 'true');
      button.addEventListener('click', function () {
        moveDialog.close();
        folderRequest('POST', '/api/videos/' + item.id + '/folder', { folder: choice.id })
          .then(refresh, function () {});
      });
      options.appendChild(button);
    });
    moveDialog.showModal();
  }

  document.getElementById('move-cancel').addEventListener('click', function () { moveDialog.close(); });
  // A tap on the dimmed background closes the dialog too.
  moveDialog.addEventListener('click', function (e) { if (e.target === moveDialog) moveDialog.close(); });

  // ------------------------------------------------------------- watch queue

  function queueRequest(method, url, body) {
    message.textContent = '';
    var options = { method: method, headers: {} };
    if (body) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    return fetch(url, options).then(function (r) {
      if (r.status === 401) { location.href = '/login'; throw new Error('login'); }
      if (!r.ok) {
        return r.text().then(function (text) {
          throw new Error(errorText(text, 'Не вдалося змінити чергу.'));
        });
      }
      return r.json();
    }).then(function (data) {
      queue = data.queue;
      renderQueue();
      updateRemote();
    }).catch(function (error) {
      if (error.message === 'login') return;
      message.textContent = error.message === 'Failed to fetch'
        ? 'Немає зв’язку із сервером. Спробуйте ще раз.' : error.message;
      throw error;
    });
  }

  function addToQueue(id, button) {
    queueRequest('POST', '/api/queue', { video_id: id }).then(function () {
      // A short tick on the button: the queue itself may be scrolled out of view.
      button.innerHTML = ICON_DONE;
      setTimeout(function () { button.innerHTML = ICON_ADD; }, 1200);
    }, function () {});
  }

  function queueButton(icon, label, disabled, onClick) {
    var button = el('button', 'icon-btn');
    button.type = 'button';
    button.innerHTML = icon;
    button.setAttribute('aria-label', label);
    button.title = label;
    button.disabled = disabled;
    button.addEventListener('click', onClick);
    return button;
  }

  function renderQueue() {
    var box = document.getElementById('queue');
    box.hidden = !queue.length;
    if (!queue.length) return;
    document.getElementById('queue-title').textContent = 'Черга · ' + queue.length;
    var playing = tvState && tvState.video_id;
    var play = document.getElementById('queue-play');
    play.textContent = playing ? 'Наступне' : 'Грати';
    play.disabled = !canCast();
    play.title = canCast() ? '' : 'Проектор не на зв’язку або на ньому не натиснули «Почати»';

    var rows = document.getElementById('queue-list');
    rows.textContent = '';
    queue.forEach(function (entry, i) {
      var row = el('li', 'q-row');
      var picture = el('img', entry.thumb ? null : 'mark');
      picture.src = entry.thumb ? '/thumb/' + entry.video_id + '?v=' + (entry.thumb_v || 1) : '/static/logo.svg';
      picture.alt = '';
      row.appendChild(picture);
      var name = el('span', 'q-name', displayName(entry.name));
      name.title = entry.name;
      row.appendChild(name);
      var move = function (to) {
        return function () {
          queueRequest('POST', '/api/queue/' + entry.entry + '/move', { position: to }).catch(function () {});
        };
      };
      row.appendChild(queueButton(ICON_UP, 'Вище', i === 0, move(i - 1)));
      row.appendChild(queueButton(ICON_DOWN, 'Нижче', i === queue.length - 1, move(i + 1)));
      row.appendChild(queueButton(ICON_REMOVE, 'Прибрати з черги', false, function () {
        queueRequest('DELETE', '/api/queue/' + entry.entry).catch(function () {});
      }));
      rows.appendChild(row);
    });
  }

  document.getElementById('queue-play').addEventListener('click', function () {
    document.body.classList.remove('remote-collapsed');
    command('next');
  });
  document.getElementById('queue-clear').addEventListener('click', function () {
    if (confirm('Очистити чергу? Відео з бібліотеки не видаляться.')) {
      queueRequest('DELETE', '/api/queue').catch(function () {});
    }
  });

  // ------------------------------------------------- selecting several videos

  function selectedIds() {
    return visibleVideos().filter(function (v) { return selected[v.id]; }).map(function (v) { return v.id; });
  }

  function updateSelectBar() {
    var count = selectedIds().length;
    document.body.classList.toggle('selecting', selecting);
    document.getElementById('select-start').hidden = selecting || !visibleVideos().length;
    ['select-count', 'select-all', 'select-delete', 'select-cancel'].forEach(function (id) {
      document.getElementById(id).hidden = !selecting;
    });
    document.getElementById('select-count').textContent = 'Вибрано: ' + count;
    document.getElementById('select-delete').disabled = !count;
    document.getElementById('select-all').textContent =
      count && count === visibleVideos().length ? 'Зняти всі' : 'Усі';
  }

  function setSelecting(on) {
    selecting = on;
    selected = {};
    renderList();
    updateSelectBar();
  }

  function toggleSelected(id) {
    if (selected[id]) delete selected[id];
    else selected[id] = true;
    renderList();
    updateSelectBar();
  }

  function deleteSelected() {
    var ids = selectedIds();
    if (!ids.length) return;
    var what = ids.length === 1 ? '1 відео' : ids.length + ' відео';
    if (!confirm('Видалити ' + what + '? Відновити їх не вдасться.')) return;
    message.textContent = '';
    var button = document.getElementById('select-delete');
    button.disabled = true;
    fetch('/api/videos/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: ids })
    }).then(function (r) {
      if (r.status === 401) { location.href = '/login'; throw new Error('login'); }
      if (!r.ok) {
        return r.text().then(function (body) {
          throw new Error(errorText(body, 'Не вдалося видалити відео.'));
        });
      }
      return r.json();
    }).then(function (result) {
      setSelecting(false);
      if (result.missing.length) message.textContent = 'Частину відео вже видалив хтось інший.';
      return refresh();
    }).catch(function (error) {
      button.disabled = false;
      if (error.message !== 'login') {
        message.textContent = error.message === 'Failed to fetch'
          ? 'Немає зв’язку із сервером. Спробуйте ще раз.' : error.message;
      }
    });
  }

  document.getElementById('select-start').addEventListener('click', function () { setSelecting(true); });
  document.getElementById('select-cancel').addEventListener('click', function () { setSelecting(false); });
  document.getElementById('select-delete').addEventListener('click', deleteSelected);
  document.getElementById('select-all').addEventListener('click', function () {
    var all = selectedIds().length === visibleVideos().length;
    selected = {};
    if (!all) visibleVideos().forEach(function (v) { selected[v.id] = true; });
    renderList();
    updateSelectBar();
  });

  // ------------------------------------------------------------------ remote

  function canCast() {
    return tvConnected && !!tvState && tvState.started;
  }

  function command(action, extra) {
    message.textContent = '';
    if (!ws || ws.readyState !== 1) {
      message.textContent = 'Немає зв’язку із сервером. Спробуйте за кілька секунд.';
      return;
    }
    var payload = { type: 'command', action: action };
    for (var key in extra || {}) payload[key] = extra[key];
    ws.send(JSON.stringify(payload));
  }

  function updateTv() {
    var text = 'Проектор не на зв’язку';
    if (tvConnected) {
      text = tvState && !tvState.started ? 'Натисніть «Почати» на проекторі' : 'Проектор на зв’язку';
    }
    document.getElementById('tv-text').textContent = text;
    document.getElementById('projector').className = 'projector' + (tvConnected ? ' on' : '');
    renderList();
    updateRemote();
    renderQueue();
  }

  function updateRemote() {
    var panel = document.getElementById('remote');
    var active = tvConnected && !!tvState && !!tvState.video_id;
    panel.hidden = !active;
    document.body.classList.toggle('has-remote', active);
    if (!active) return;
    document.getElementById('remote-title').textContent = tvState.name || '';
    var icon = tvState.paused ? ICON_PLAY : ICON_PAUSE;
    document.getElementById('r-play-icon').setAttribute('d', icon);
    document.getElementById('r-mini-icon').setAttribute('d', icon);
    var seek = document.getElementById('r-seek');
    seek.max = Math.floor(tvState.duration || 0);
    document.getElementById('r-dur').textContent = formatDuration(tvState.duration || 0);
    if (!seeking) {
      seek.value = Math.floor(tvState.position || 0);
      document.getElementById('r-pos').textContent = formatDuration(tvState.position || 0);
    }
    if (document.activeElement !== document.getElementById('r-vol')) {
      document.getElementById('r-vol').value = Math.round((tvState.volume || 0) * 100);
    }
    var ready = readyVideos();
    var index = currentIndex(ready);
    document.getElementById('r-prev').disabled = index <= 0;
    // "Next" takes the queue first and falls back to the library order.
    document.getElementById('r-next').disabled = !queue.length && (index < 0 || index >= ready.length - 1);
    var upNext = document.getElementById('up-next');
    upNext.hidden = !queue.length;
    upNext.textContent = queue.length ? 'Далі: ' + displayName(queue[0].name) : '';
  }

  function readyVideos() {
    return videosCache.filter(function (v) { return v.status === 'ready'; });
  }

  function currentIndex(ready) {
    for (var i = 0; i < ready.length; i++) {
      if (tvState && ready[i].id === tvState.video_id) return i;
    }
    return -1;
  }

  function step(delta) {
    if (delta > 0 && queue.length) { command('next'); return; }
    var ready = readyVideos();
    var target = ready[currentIndex(ready) + delta];
    if (target) command('load', { video_id: target.id });
  }

  function togglePlay() {
    if (tvState) command(tvState.paused ? 'play' : 'pause');
  }

  function connect() {
    clearTimeout(wsTimer);
    if (ws && ws.readyState <= 1) return;
    var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var socket = new WebSocket(scheme + location.host + '/ws?role=remote');
    ws = socket;
    socket.onopen = function () { wsRetry = 1000; };
    socket.onmessage = function (event) {
      var data;
      try { data = JSON.parse(event.data); } catch (e) { return; }
      if (data.type === 'tv') {
        tvConnected = data.connected;
        if (!tvConnected) tvState = null;
        updateTv();
      } else if (data.type === 'state') {
        tvState = data;
        updateTv();
      } else if (data.type === 'queue') {
        queue = data.queue || [];
        renderQueue();
        updateRemote();
      } else if (data.type === 'error') {
        message.textContent = data.message;
      }
    };
    socket.onclose = function (event) {
      if (ws !== socket) return;
      ws = null;
      if (event.code === 4401) { location.href = '/login'; return; }
      tvConnected = false;
      tvState = null;
      // The server sends the queue again on reconnect (or nothing, if it is empty by then).
      queue = [];
      updateTv();
      wsTimer = setTimeout(connect, wsRetry);
      wsRetry = Math.min(wsRetry * 2, 5000);
    };
  }

  // ------------------------------------------------- pairing a projector

  var pairBox = document.getElementById('pair');
  document.getElementById('pair-url').textContent = location.host + '/tv';

  function togglePair(open) {
    pairBox.hidden = open === undefined ? !pairBox.hidden : !open;
    document.getElementById('projector').setAttribute('aria-expanded', String(!pairBox.hidden));
    if (!pairBox.hidden) pairBox.scrollIntoView({ block: 'nearest' });
  }

  document.getElementById('projector').addEventListener('click', function () { togglePair(); });
  document.getElementById('pair-link').addEventListener('click', function (e) {
    e.preventDefault();
    togglePair(true);
  });

  document.getElementById('r-play').addEventListener('click', togglePlay);
  document.getElementById('r-mini').addEventListener('click', togglePlay);
  document.getElementById('r-back').addEventListener('click', function () { command('seek_by', { value: -10 }); });
  document.getElementById('r-fwd').addEventListener('click', function () { command('seek_by', { value: 10 }); });
  document.getElementById('r-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('r-next').addEventListener('click', function () { step(1); });
  document.getElementById('r-stop').addEventListener('click', function () { command('stop'); });
  document.getElementById('remote-toggle').addEventListener('click', function () {
    document.body.classList.toggle('remote-collapsed');
  });
  document.getElementById('r-seek').addEventListener('input', function () {
    seeking = true;
    document.getElementById('r-pos').textContent = formatDuration(Number(this.value));
  });
  document.getElementById('r-seek').addEventListener('change', function () {
    seeking = false;
    command('seek', { value: Number(this.value) });
  });
  document.getElementById('r-vol').addEventListener('input', function () {
    command('volume', { value: Number(this.value) / 100 });
  });
  // After the phone is unlocked, reconnect at once without waiting for the timer.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') connect();
  });

  function refresh() {
    return fetch('/api/videos')
      .then(function (r) {
        if (r.status === 401) { location.href = '/login'; throw new Error('login'); }
        if (!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(function (data) {
        maxUpload = data.max_upload;
        disk.textContent = 'Вільно на сервері: ' + formatSize(data.disk.free);
        schedule(data);
        videosCache = data.videos;
        folders = data.folders || [];
        // A folder deleted elsewhere: back to all videos.
        if (currentFolder !== 'all' && currentFolder !== 'none' && !folderById(currentFolder)) {
          currentFolder = 'all';
        }
        if (currentFolder === 'none' && !folders.length) currentFolder = 'all';
        renderFolders();
        // Videos deleted elsewhere drop out of the selection.
        var present = {};
        videosCache.forEach(function (v) { present[v.id] = true; });
        Object.keys(selected).forEach(function (id) { if (!present[id]) delete selected[id]; });
        if (isAdmin) updateSelectBar();
        renderList();
      })
      .catch(function () {
        message.textContent = 'Не вдалося отримати список відео. Перевірте з’єднання із сервером.';
        clearTimeout(pollTimer);
        pollTimer = setTimeout(refresh, 10000);
      });
  }

  function retry(id) {
    message.textContent = '';
    fetch('/api/videos/' + id + '/retry', { method: 'POST' })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (body) {
          message.textContent = errorText(body, 'Не вдалося повторити обробку.');
        });
      })
      .then(refresh)
      .catch(function () {
        message.textContent = 'Не вдалося повторити обробку. Спробуйте ще раз.';
      });
  }

  function upload(file) {
    message.textContent = '';
    if (file.size > maxUpload) {
      message.textContent = 'Файл завеликий: ' + formatSize(file.size) + ', дозволено до ' + formatSize(maxUpload) + '.';
      return;
    }
    uploadBtn.disabled = true;
    progress.hidden = false;
    progressName.textContent = file.name;
    progressPct.textContent = '0%';
    progressBar.style.width = '0';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/videos');
    xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
    if (folderById(currentFolder)) xhr.setRequestHeader('X-Folder', currentFolder);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = function (e) {
      if (!e.lengthComputable) return;
      var pct = Math.floor(e.loaded / e.total * 100);
      progressPct.textContent = pct + '%';
      progressBar.style.width = pct + '%';
    };
    function done() {
      uploadBtn.disabled = false;
      progress.hidden = true;
      fileInput.value = '';
    }
    xhr.onload = function () {
      done();
      if (xhr.status === 201) {
        refresh();
      } else if (xhr.status === 401) {
        location.href = '/login';
      } else {
        message.textContent = errorText(xhr.responseText, 'Не вдалося завантажити відео (помилка ' + xhr.status + ').');
      }
    };
    xhr.onerror = function () {
      done();
      message.textContent = 'Завантаження обірвалося. Перевірте з’єднання і спробуйте ще раз.';
    };
    xhr.send(file);
  }

  function remove(id) {
    message.textContent = '';
    fetch('/api/videos/' + id, { method: 'DELETE' })
      .then(function (r) {
        if (!r.ok && r.status !== 404) throw new Error('status ' + r.status);
        return refresh();
      })
      .catch(function () {
        message.textContent = 'Не вдалося видалити відео. Спробуйте ще раз.';
      });
  }

  function openPlayer(item) {
    playerTitle.textContent = item.name;
    document.getElementById('player-info').textContent = item.info ? qualityDetails(item.info) : '';
    video.src = '/media/' + item.id;
    player.hidden = false;
    var started = video.play();
    if (started && started.catch) started.catch(function () {});
  }

  function closePlayer() {
    video.pause();
    video.removeAttribute('src');
    video.load();
    player.hidden = true;
  }

  uploadBtn.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    if (fileInput.files.length) upload(fileInput.files[0]);
  });
  document.getElementById('player-close').addEventListener('click', closePlayer);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!player.hidden) closePlayer();
    else if (selecting) setSelecting(false);
  });
  document.addEventListener('click', function (e) {
    var menus = document.querySelectorAll('details.menu[open]');
    for (var i = 0; i < menus.length; i++) {
      if (!menus[i].contains(e.target)) menus[i].open = false;
    }
  });

  fetch('/api/me')
    .then(function (r) {
      if (r.status === 401) { location.href = '/login'; throw new Error('login'); }
      return r.json();
    })
    .then(function (me) {
      isAdmin = me.role === 'admin';
      document.getElementById('who').textContent = 'Ви увійшли як ' + me.username;
      canManage = me.role !== 'device';
      document.getElementById('select-bar').hidden = !isAdmin;
      uploadBtn.hidden = !canManage;
      disk.hidden = !canManage;
      document.getElementById('users-link').hidden = !isAdmin;
      document.getElementById('settings-link').hidden = !canManage;
      connect();
      return refresh();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
