<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1115">
<title>Підключення проектора — Promin</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #0F1115;
    color: #F2F0EA;
    font: 400 16px/1.4 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 400px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; }
  .brand img { width: 28px; height: 28px; }
  .brand span { font-size: 22px; font-weight: 700; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
  p { margin: 0; color: #9AA0AA; }
  button, a.button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 56px;
    margin-top: 24px;
    font: inherit;
    font-weight: 600;
    font-size: 18px;
    color: #0F1115;
    background: #FFC53D;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
  }
  a.button.quiet { margin-top: 8px; color: #F2F0EA; background: transparent; border: 1px solid #2A2E37; }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, a.button:focus-visible { outline: 2px solid #F2F0EA; outline-offset: 2px; }
  .error { min-height: 24px; margin: 16px 0 0; color: #FF6B5E; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/static/logo.svg" alt="">
    <span>Promin</span>
  </div>

  <section id="ask">
    <h1>Підключити проектор?</h1>
    <p>Він зможе показувати відео з бібліотеки. Підтверджуйте, лише якщо ви щойно зчитали цей код з екрана свого проектора, а не отримали посилання від когось.</p>
    <button id="approve" type="button">Підключити</button>
    <a class="button quiet" href="/">Скасувати</a>
    <p class="error" id="error" role="alert"></p>
  </section>

  <section id="done" hidden>
    <h1>Проектор підключено</h1>
    <p>За кілька секунд на його екрані з'явиться кнопка «Почати».</p>
    <a class="button" href="/">До відео</a>
  </section>
</main>
<script>
(function () {
  var key = new URLSearchParams(location.search).get('t') || '';
  var button = document.getElementById('approve');
  var error = document.getElementById('error');

  button.addEventListener('click', function () {
    button.disabled = true;
    error.textContent = '';
    fetch('/api/pair/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key })
    }).then(function (r) {
      if (r.status === 401) { location.reload(); return; }
      if (r.ok) {
        document.getElementById('ask').hidden = true;
        document.getElementById('done').hidden = false;
        return;
      }
      return r.json().then(function (body) {
        error.textContent = (body && typeof body.detail === 'string' && body.detail) || 'Не вдалося підключити проектор.';
        button.disabled = false;
      });
    }).catch(function () {
      error.textContent = 'Немає зв’язку із сервером. Спробуйте ще раз.';
      button.disabled = false;
    });
  });
})();
</script>
</body>
</html>
