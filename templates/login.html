<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1115">
<title>Вхід — Promin</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #0F1115;
    color: #F2F0EA;
    font: 400 16px/1.4 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form { width: 100%; max-width: 400px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; }
  .brand img { width: 28px; height: 28px; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 700; }
  label { display: block; margin-bottom: 8px; color: #9AA0AA; font-size: 14px; }
  input {
    width: 100%;
    height: 56px;
    padding: 0 16px;
    font: inherit;
    font-size: 18px;
    color: #F2F0EA;
    background: #1A1D24;
    border: 1px solid #2A2E37;
    border-radius: 12px;
  }
  input:focus { outline: 2px solid #FFC53D; outline-offset: 2px; }
  button {
    width: 100%;
    height: 56px;
    margin-top: 16px;
    font: inherit;
    font-weight: 600;
    font-size: 18px;
    color: #0F1115;
    background: #FFC53D;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  button:focus { outline: 2px solid #F2F0EA; outline-offset: 2px; }
  .error { min-height: 24px; margin: 16px 0 0; color: #FF6B5E; font-size: 14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="brand">
    <img src="/static/logo.svg" alt="">
    <h1>Promin</h1>
  </div>
  <label for="token">Токен доступу</label>
  <input id="token" name="token" type="password" autocomplete="current-password"
         autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
  <button type="submit">Увійти</button>
  <p class="error" role="alert">{{error}}</p>
</form>
</body>
</html>
