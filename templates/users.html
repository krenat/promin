<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<title>Користувачі — Promin</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1115; --panel: #1A1D24; --line: #2A2E37; --text: #F2F0EA;
    --muted: #9AA0AA; --accent: #FFC53D; --on-accent: #0F1115; --danger: #FF6B5E;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 16px/1.4 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 8px; height: 48px; margin-bottom: 16px; }
  header a.back {
    display: grid; place-items: center; width: 48px; height: 48px; margin-left: -12px;
    color: var(--text); text-decoration: none; font-size: 24px; border-radius: 50%;
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; }
  h2 { margin: 32px 0 16px; font-size: 16px; font-weight: 600; color: var(--muted); }
  button, input, select { font: inherit; }
  button {
    font-weight: 600; min-height: 48px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid transparent; cursor: pointer; transition: border-color 150ms, opacity 150ms;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .primary { background: var(--accent); color: var(--on-accent); width: 100%; }
  .outline { background: transparent; color: var(--text); border-color: var(--line); }
  .danger { background: transparent; color: var(--danger); border-color: var(--line); }
  #list { display: grid; gap: 8px; }
  .user { background: var(--panel); border-radius: var(--radius); padding: 16px; }
  .user .top { display: flex; align-items: baseline; gap: 8px; }
  .user .name { font-weight: 600; overflow-wrap: anywhere; }
  .user .role { color: var(--muted); font-size: 14px; }
  .user .note { margin-top: 8px; color: var(--muted); font-size: 14px; }
  .user .actions { display: flex; gap: 8px; margin-top: 16px; }
  .user .actions button { flex: 1; }
  form { display: grid; gap: 16px; }
  label { display: grid; gap: 8px; color: var(--muted); font-size: 14px; }
  input, select {
    width: 100%; height: 48px; padding: 0 16px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .hint { margin: -8px 0 0; color: var(--muted); font-size: 14px; }
  #message { min-height: 24px; margin: 16px 0 0; color: var(--danger); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <a class="back" href="/" aria-label="Назад до відео">←</a>
    <h1>Користувачі</h1>
  </header>

  <section id="list" aria-live="polite"></section>
  <p id="message" role="alert"></p>

  <h2>Новий користувач</h2>
  <form id="add">
    <label>Логін
      <input name="username" autocomplete="off" autocapitalize="none" autocorrect="off"
             spellcheck="false" required minlength="2" maxlength="32" pattern="[a-z0-9][a-z0-9_\-]+">
    </label>
    <label>Пароль
      <input name="password" type="text" autocomplete="off" autocapitalize="none" autocorrect="off"
             spellcheck="false" required minlength="8" maxlength="200">
    </label>
    <p class="hint">Щонайменше 8 символів. Пароль видно, щоб ви могли передати його людині.</p>
    <label>Роль
      <select name="role">
        <option value="viewer">Глядач: дивиться відео</option>
        <option value="admin">Адміністратор: завантажує, видаляє, керує користувачами</option>
      </select>
    </label>
    <button class="primary" type="submit">Додати користувача</button>
  </form>
</main>

<script>
(function () {
  var list = document.getElementById('list');
  var message = document.getElementById('message');
  var form = document.getElementById('add');
  var roleNames = { admin: 'адміністратор', viewer: 'глядач' };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function api(method, url, body) {
    var options = { method: method, headers: {} };
    if (body) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    return fetch(url, options).then(function (r) {
      if (r.status === 401) { location.href = '/login'; throw new Error('login'); }
      if (r.ok) return r.status === 204 ? null : r.json();
      return r.json().catch(function () { return {}; }).then(function (data) {
        throw new Error(typeof data.detail === 'string' ? data.detail : 'Помилка ' + r.status);
      });
    });
  }

  function fail(error) {
    if (error.message !== 'login') message.textContent = error.message;
  }

  function render(users) {
    list.textContent = '';
    users.forEach(function (user) {
      var card = el('div', 'user');
      var top = el('div', 'top');
      top.appendChild(el('span', 'name', user.username));
      top.appendChild(el('span', 'role', roleNames[user.role] || user.role));
      card.appendChild(top);
      if (user.builtin) {
        card.appendChild(el('div', 'note', 'Вбудований обліковий запис. Його пароль задається на сервері в PROMIN_TOKEN.'));
      } else {
        var actions = el('div', 'actions');
        var change = el('button', 'outline', 'Змінити пароль');
        change.type = 'button';
        change.addEventListener('click', function () {
          var password = prompt('Новий пароль для ' + user.username + ' (щонайменше 8 символів):');
          if (password == null) return;
          message.textContent = '';
          api('POST', '/api/users/' + encodeURIComponent(user.username) + '/password', { password: password })
            .then(function () { message.textContent = ''; })
            .catch(fail);
        });
        var remove = el('button', 'danger', 'Видалити');
        remove.type = 'button';
        remove.addEventListener('click', function () {
          if (!confirm('Видалити користувача ' + user.username + '? Він одразу втратить доступ.')) return;
          message.textContent = '';
          api('DELETE', '/api/users/' + encodeURIComponent(user.username)).then(load).catch(fail);
        });
        actions.appendChild(change);
        actions.appendChild(remove);
        card.appendChild(actions);
      }
      list.appendChild(card);
    });
  }

  function load() {
    return api('GET', '/api/users').then(function (data) { render(data.users); }).catch(fail);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    message.textContent = '';
    api('POST', '/api/users', {
      username: form.username.value.trim().toLowerCase(),
      password: form.password.value,
      role: form.role.value
    }).then(function () { form.reset(); return load(); }).catch(fail);
  });

  load();
})();
</script>
</body>
</html>
